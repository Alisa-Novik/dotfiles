# Flat status bar; preserve live Codex labels and activity in both modes.
set -g status-bg '#031219'
set -g status-fg '#91a8aa'
set -g status-style 'fg=#91a8aa,bg=#031219'
set -g status-right-style 'fg=#91a8aa,bg=#031219'
set -g window-status-style 'fg=#91a8aa,bg=#031219,nobold'
set -g window-status-current-style 'fg=#91a8aa,bg=#002831,nobold'
set -g window-status-format ' #I #{E:@codex_window_state}#[#{E:window-status-style}]#{=/14/…:#{?@codex_window_label,#{E:@codex_window_label},#{window_name}}} '
set -g window-status-current-format ' #I #{E:@codex_window_state}#[#{E:window-status-current-style}]#{=/26/…:#{?@codex_window_label,#{E:@codex_window_label},#{window_name}}} '
set -g window-status-separator ' '
set -g status-right '#[fg=#91a8aa,bg=#031219] %H:%M '
set -g pane-border-style 'fg=#002831'
set -g pane-active-border-style 'fg=#91a8aa'
set -g message-style 'fg=#91a8aa,bg=#002831'
set -g message-command-style 'fg=#91a8aa,bg=#002831'
set -g mode-style 'fg=#91a8aa,bg=#002831'
set -g clock-mode-colour '#91a8aa'
set -g @term_working '#d49a0a'
set -g @term_ready '#32b9aa'
