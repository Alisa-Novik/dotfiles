# Flat status bar; preserve live Codex labels and activity in both modes.
set -g status-bg '#f7f1e8'
set -g status-fg '#171512'
set -g status-style 'fg=#4f4942,bg=#f7f1e8'
set -g status-right-style 'fg=#4f4942,bg=#f7f1e8'
set -g window-status-style 'fg=#4f4942,bg=#f7f1e8,nobold'
set -g window-status-current-style 'fg=#171512,bg=#d5e4df,nobold'
set -g window-status-format ' #I #{E:@codex_window_state}#[#{E:window-status-style}]#{=/14/…:#{?@codex_window_label,#{E:@codex_window_label},#{window_name}}} '
set -g window-status-current-format ' #I #{E:@codex_window_state}#[#{E:window-status-current-style}]#{=/26/…:#{?@codex_window_label,#{E:@codex_window_label},#{window_name}}} '
set -g window-status-separator ' '
set -g status-right '#[fg=#4f4942,bg=#f7f1e8] %H:%M '
set -g pane-border-style 'fg=#c1b8aa'
set -g pane-active-border-style 'fg=#236654'
set -g message-style 'fg=#171512,bg=#d5e4df'
set -g message-command-style 'fg=#171512,bg=#d5e4df'
set -g mode-style 'fg=#171512,bg=#d5e4df'
set -g clock-mode-colour '#236654'
set -g @term_working '#765500'
set -g @term_ready '#236654'
